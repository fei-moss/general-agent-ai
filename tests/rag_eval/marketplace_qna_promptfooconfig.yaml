description: "SPEC-RAG-EVAL-002 Marketplace QnA bilingual semantic retrieval eval"

prompts:
  - "{{query}}"

providers:
  - id: "file://provider.py"
    label: "marketplace-qna-rag-retriever"
    config:
      pythonExecutable: ".venv/bin/python"
      corpus_path: "marketplace_qna_corpus.jsonl"
      embedding_provider: "gemini"
      embedding_model: "gemini-embedding-2"
      embedding_dim: 1536
      rag_chunk_size: 400
      rag_chunk_overlap: 80
      retrieval_top_k: 5
      ingest_batch_size: 1
      timeout_s: 60

tests:
  - "file://marketplace_qna_test_cases.py:generate_tests"
